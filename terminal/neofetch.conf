# Berserk Hacker Red — compact, privacy-safe terminal summary.

print_info() {
    prin "BERSERK RED" "CINNAMON RICE"
    prin "───────────" "─────────────"
    info "OS" distro
    info "Kernel" kernel
    info "Uptime" uptime
    info "Packages" packages
    info "Desktop" de
    info "Window Manager" wm
    info "GTK Theme" theme
    info "Icons" icons
    info "Terminal" term
    info "CPU" cpu
    info "GPU" gpu
    info "Memory" memory
    info "Storage" disk
}

title_fqdn="off"
kernel_shorthand="on"
distro_shorthand="tiny"
os_arch="off"
uptime_shorthand="tiny"
memory_percent="on"
package_managers="off"
shell_path="off"
shell_version="off"
cpu_brand="on"
cpu_speed="off"
cpu_cores="logical"
cpu_temp="off"
gpu_brand="on"
gpu_type="all"
gtk_shorthand="on"
gtk2="on"
gtk3="on"
public_ip_host="http://ident.me"
disk_show=("/")
disk_subtitle="mount"
disk_percent="on"

colors=(9 1 1 9 1 7)
bold="on"
underline_enabled="off"
separator="  ::"
color_blocks="off"

image_backend="ascii"
image_source="${XDG_CONFIG_HOME:-$HOME/.config}/neofetch/berserk-logo.txt"
ascii_distro="auto"
ascii_colors=(9)
ascii_bold="on"
ascii_invert="off"
crop_mode="normal"
gap=4
