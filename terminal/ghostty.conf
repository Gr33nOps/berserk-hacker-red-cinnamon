# Berserk Hacker Red — Ghostty
# Calm near-black canvas, crimson structure, warm ivory text.

# Typography
font-family = JetBrainsMono Nerd Font
font-size = 11.5
font-thicken = true
adjust-cell-height = 0%

# Core palette
background = #070405
foreground = #eadfcf
minimum-contrast = 1.25
bold-is-bright = true

# Cursor and selection
cursor-color = #ff3347
cursor-text = #070405
cursor-style = block
cursor-style-blink = true
selection-background = #64101d
selection-foreground = #fff4e8
selection-clear-on-typing = true

# ANSI colors: every hue is pulled toward ash, wine, or crimson while
# preserving enough separation for logs, diffs, syntax, and system tools.
palette = 0=#12090b
palette = 1=#c92f42
palette = 2=#a86168
palette = 3=#d18762
palette = 4=#995166
palette = 5=#b54f78
palette = 6=#bd6c70
palette = 7=#d9cfc4
palette = 8=#5a3338
palette = 9=#ff3347
palette = 10=#d78388
palette = 11=#f0a078
palette = 12=#c76c84
palette = 13=#e36b99
palette = 14=#e58f91
palette = 15=#fff4e8

# Window chrome and spacing
window-theme = ghostty
window-titlebar-background = #11070a
window-titlebar-foreground = #eadfcf
window-title-font-family = Inter SemiBold
window-subtitle = working-directory
window-padding-x = 14
window-padding-y = 11
window-padding-balance = true
window-padding-color = background
window-width = 58
window-height = 25
window-show-tab-bar = auto
gtk-titlebar = true
gtk-titlebar-style = tabs
gtk-toolbar-style = raised-border
gtk-wide-tabs = false

# Subtle translucency keeps the wallpaper atmosphere without hurting text.
background-opacity = 0.985
background-blur = true
unfocused-split-opacity = 0.82
unfocused-split-fill = #18080c

# Quality of life
command = berserk-terminal-shell
shell-integration = detect
shell-integration-features = cursor,no-sudo,title,no-ssh-env,no-ssh-terminfo,path
copy-on-select = clipboard
cursor-click-to-move = true
confirm-close-surface = true
resize-overlay = after-first

# Familiar tab/split controls
keybind = ctrl+shift+t=new_tab
keybind = ctrl+shift+w=close_tab:this
keybind = ctrl+shift+o=new_split:right
keybind = ctrl+shift+e=new_split:down
keybind = ctrl+alt+arrow_left=goto_split:left
keybind = ctrl+alt+arrow_right=goto_split:right
keybind = ctrl+alt+arrow_up=goto_split:up
keybind = ctrl+alt+arrow_down=goto_split:down
